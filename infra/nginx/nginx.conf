# catlog — the http-level nginx configuration, BAKED INTO catlog-nginx.
#
# This file is domain-independent on purpose. Everything host-specific — the
# certificates, `server_name`, and the Cloudflare real_ip ranges — is rendered
# by Ansible into /etc/nginx/catlog.d/, which the `include` at the bottom of
# `http {}` picks up. An image that knew the domain could not be promoted
# between environments, and a config with a placeholder in it cannot be
# validated by `nginx -t` at build time. This one is, in Dockerfile.nginx.
#
#   /etc/nginx/catlog.d/00-bootstrap.conf   baked   default_server → 503
#   /etc/nginx/catlog.d/10-catlog.conf      mounted rendered from site.conf.j2
#   /etc/nginx/catlog.d/20-realip.conf      mounted rendered from realip.conf.j2

# The brotli modules, built against this exact nginx version in the
# `nginx-modules` stage. `load_module` is only valid at the top level, and only
# before `events {}`.
load_module modules/ngx_http_brotli_filter_module.so;
load_module modules/ngx_http_brotli_static_module.so;

worker_processes auto;
pid /var/run/nginx.pid;

# Every connection costs at least one file descriptor, and a proxied one costs
# two — client plus upstream. `worker_connections 4096` below is therefore a
# promise nginx cannot keep on a default 1024-descriptor limit, and it says so
# at startup:
#
#     [warn] 4096 worker_connections exceed open file resource limit: 1024
#
# This raises the workers' soft limit toward the container's hard limit, which
# compose.prod.yaml sets to 65535. Both halves are needed: nginx cannot raise a
# soft limit above the hard one, and Docker's default hard limit is inherited
# from the daemon rather than being generous.
worker_rlimit_nofile 65535;

# stderr, not a file. Both containers log to the standard streams so Docker's
# json-file driver is the single source and `make ops-logs` is one command —
# which is also what keeps logrotate off the VM.
error_log /dev/stderr warn;

events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    server_tokens   off;
    keepalive_timeout 65;
    types_hash_max_size 4096;

    # §4.3 caps an ingest batch at 1 MiB compressed; nginx rejects at 2 MiB so
    # an oversize body never reaches Go. The catlogd limit is the real one.
    client_max_body_size 2m;

    # --- logging ------------------------------------------------------------
    # JSON, so `make ops-logs` produces one bundle in which both catlogd's slog
    # output and nginx's access log can be read with the same tool.
    #
    # $remote_addr is the CLIENT address only because 20-realip.conf rewrites it
    # from CF-Connecting-IP. Without that file in place it is a Cloudflare edge
    # address — see the comment in realip.conf.j2, which is where the hazard is
    # explained in full.
    log_format catlog_json escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"referer":"$http_referer",'
        '"ua":"$http_user_agent",'
        '"encoding":"$sent_http_content_encoding",'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"cf_ray":"$http_cf_ray"'
        '}';
    access_log /dev/stdout catlog_json;

    # --- compression --------------------------------------------------------
    #
    # Two mechanisms, and they cover different things:
    #
    #   brotli_static / gzip_static  serve the .br / .gz siblings that
    #     scripts/precompress.mjs produced at build time. Static assets are
    #     therefore never compressed at request time, and they were compressed
    #     at brotli quality 11 — a setting no on-the-fly path could afford.
    #
    #   brotli / gzip                compress PROXIED responses: catlogd's
    #     server-rendered HTML and its JSON. There is no file to pre-compress
    #     for those, so this is the only option, and level 5 is the point on the
    #     curve where latency still beats the last few percent of ratio.
    #
    # Which encoding a client gets is the client's choice, expressed in
    # Accept-Encoding. With ngx_brotli loaded as a dynamic module its static
    # handler runs ahead of the built-in gzip_static, so a browser advertising
    # both gets brotli. That ordering is asserted, not assumed — see
    # server/internal/nginxproxy.
    brotli_static on;
    gzip_static   on;
    gzip_vary     on;

    brotli            on;
    brotli_comp_level 5;
    brotli_min_length 1024;
    brotli_types      text/plain text/css text/xml
                      application/javascript application/json application/xml
                      application/manifest+json image/svg+xml;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml
                      application/javascript application/json application/xml
                      application/manifest+json image/svg+xml;

    # NOT in either list, and it must stay that way:
    #   text/event-stream  — compressing a stream buffers it, and the contract
    #                        is that a feed frame arrives in under a second.
    # text/html is compressed by default by both modules (it is always in the
    # implicit type list) and that is wanted: every datastar page is
    # server-rendered HTML from catlogd with no file to pre-compress.

    # --- rate limiting ------------------------------------------------------
    # Zones must live in http{}; a zone cannot be declared inside a server block.
    #
    # catlog_ingest 2r/s burst 10 — one player ships at most one batch per 2 s
    #   (§4.3), and catlogd enforces that per CREDENTIAL anyway. 2r/s is ~4x a
    #   single player, so a household behind one NAT address is unaffected while
    #   a single hostile IP cannot make catlogd verify thousands of ECDSA
    #   signatures per second. This is the outer guard; the per-credential token
    #   bucket is the real one.
    # catlog_web 20r/s burst 40 — a page load pulls several assets and the
    #   boards poll; above this is a scraper.
    # catlog_conn 20 — one SSE stream is one held connection per tab.
    limit_req_zone  $binary_remote_addr zone=catlog_ingest:10m rate=2r/s;
    limit_req_zone  $binary_remote_addr zone=catlog_web:10m    rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=catlog_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # --- upstream -----------------------------------------------------------
    #
    # `catlogd` is the compose service name on catlog_net, so this stays
    # domain-independent and can be baked into the image.
    #
    # RESOLVED AT REQUEST TIME, NOT AT PARSE TIME, and that is deliberate. An
    # `upstream {}` block resolves its server names when the configuration is
    # read, which has two consequences here, both bad:
    #
    #   1. `nginx -t` in the image build fails — there is no `catlogd` host in a
    #      build stage — so the config could not be validated where it is cheap
    #      to fix.
    #   2. Worse: a deploy STOPS catlogd before starting it (the database lock
    #      leaves no alternative). While it is stopped, Docker's DNS does not
    #      resolve the name at all, so an nginx that restarted in that window
    #      would fail to start and stay down — turning a few seconds of 502 into
    #      an outage that outlives the deploy.
    #
    # Using a variable defers resolution to each request: nginx always starts,
    # and while catlogd is away it answers 502, which `location /` turns into
    # the maintenance page. 127.0.0.11 is Docker's embedded DNS, present because
    # catlog_net is a user-defined network.
    #
    # The cost is the upstream keepalive pool. On a bridge network in front of
    # an origin that sits behind a CDN and emits `s-maxage=30`, a TCP handshake
    # per proxied request is not a number anybody will ever measure.
    #
    # There is exactly one catlogd, forever: tursogo holds an exclusive
    # whole-file lock that excludes other processes, so a second one could not
    # open the databases.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $host $catlogd_upstream {
        default "catlogd:8080";
    }

    # --- the default server -------------------------------------------------
    #
    # Baked in here rather than shipped as a file in catlog.d/, because that
    # directory is bind-mounted WHOLE from the host and anything in the image
    # would be hidden by the mount.
    #
    # Two jobs. Before Ansible has rendered a server block, this answers with
    # something honest instead of nothing — "connection refused" and "the config
    # mount is wrong" look identical from outside. Afterwards it stays as the
    # `default_server`, so a request whose Host header matches no `server_name`
    # — a direct-to-IP scan, a stale DNS entry, somebody else's domain pointed
    # here — gets 503 rather than catlog.
    #
    # It deliberately does not listen on 443: answering TLS for an unknown SNI
    # would mean presenting catlog's certificate to whoever asked.
    server {
        listen      80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # ACME http-01 is not used (DNS-01 is — see infra/ansible/roles/acme), but
        # leaving the path unshadowed costs nothing and makes a fallback possible
        # without editing the image.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        # The container healthcheck's target, on the DEFAULT server on purpose:
        # it must answer while catlogd is down — that is exactly when nginx has
        # to stay up to serve the maintenance page — so it cannot be a route
        # that proxies anywhere. `access_log off` because a probe every 15
        # seconds is 5,760 lines a day that say nothing.
        location = /nginx-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            default_type application/json;
            return 503 '{"error":"not_configured","detail":"no catlog server block is installed for this host"}';
        }
    }

    # Rendered by roles/catlog_nginx. THE DIRECTORY IS MOUNTED, NOT THE FILES
    # INSIDE IT — mounting individual files means Docker invents a missing
    # source as a directory, and a container remembers the type of every mount
    # point it was created with, so one early start leaves nginx unable to start
    # ever again. A directory mount cannot have that mismatch.
    include /etc/nginx/catlog.d/*.conf;
}
