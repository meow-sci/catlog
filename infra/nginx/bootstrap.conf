# catlog — the default server, BAKED INTO catlog-nginx.
#
# Two jobs, both of which matter before and after Ansible has rendered
# 10-catlog.conf beside this file:
#
#   1. Until the real server block is mounted, this image answers something
#      honest instead of nothing. "Connection refused" and "the config mount is
#      wrong" look identical from outside; a 503 with a reason does not.
#
#   2. Afterwards it stays as the `default_server`, so a request whose Host
#      header matches no `server_name` — a direct-to-IP scan, a stale DNS entry,
#      somebody else's domain pointed at this address — gets 503 rather than
#      catlog. With Cloudflare in front, every legitimate request carries the
#      real Host, so anything landing here is by definition not a visitor.
#
# It deliberately does not listen on 443: answering TLS for an unknown SNI would
# mean presenting catlog's certificate to whoever asked.

server {
    listen      80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME http-01 is not used (DNS-01 is — see infra/ansible/roles/acme), but
    # leaving the path unshadowed costs nothing and makes a fallback possible
    # without editing the image.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        default_type application/json;
        return 503 '{"error":"not_configured","detail":"no catlog server block is installed for this host"}';
    }
}
