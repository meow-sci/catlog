# catlog — nginx development configuration (§6.1).
#
# This is a COMPLETE nginx.conf (it carries its own `events`/`http` blocks), not
# a site snippet: mount it at /etc/nginx/nginx.conf, never at conf.d/.
#
# Two placeholders are substituted before nginx ever reads the file — they are
# NOT nginx variables:
#
#   $UPSTREAM      host:port of catlogd, e.g. host.docker.internal:8080
#                  (infra/compose.yaml) or host.testcontainers.internal:<port>
#                  (server/internal/nginxproxy, §6.3).
#   $STATIC_ROOT   directory holding the built site assets (site/dist).
#
# infra/compose.yaml substitutes them with the nginx image's envsubst template
# mechanism; the Go test suite substitutes them in-process. Every other `$name`
# below is a real nginx variable and must survive substitution untouched.
#
# Dev only: plaintext on 8081 (§3), no TLS, no HSTS. See prod.conf.example.

worker_processes 1;
events { worker_connections 1024; }
http {
  include mime.types;
  default_type application/octet-stream;
  sendfile on;
  server_tokens off;

  limit_req_zone $binary_remote_addr zone=ingest_ip:10m rate=10r/s;
  limit_req_status 429;

  upstream catlogd { server $UPSTREAM; keepalive 16; }

  server {
    listen 8081;
    client_max_body_size 2m;

    location = /v1/ingest {
      limit_req zone=ingest_ip burst=20 nodelay;
      proxy_pass http://catlogd;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $host;
      # body is brotli-compressed application/x-ndjson — pass through untouched
      proxy_request_buffering on;
    }

    # Every SSE route: the datastar feed, the JSON feed stream, the raw event
    # stream and its future datastar twin. One regex rather than four blocks so
    # a stream route added to catlogd fails loudly here (buffered chunks)
    # instead of working by accident.
    location ~ ^/v1/(feed/(sse|stream)|events/(sse|stream))$ {
      proxy_pass http://catlogd;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      add_header X-Accel-Buffering no;
    }

    location /static/ {
      alias $STATIC_ROOT/;      # site/dist
      expires 1h;
      gzip on; gzip_types text/css application/javascript;
    }

    location /admin/ { return 403; }   # belt & suspenders; admin binds loopback:6060 anyway

    location / {
      proxy_pass http://catlogd;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $host;
      gzip on; gzip_types text/html application/json text/css application/javascript;
    }
  }
}
