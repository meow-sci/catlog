# catlog — the production inventory.
#
# One host, and it is named by the environment rather than committed: the
# address of a production box is not a secret but it is not repository content
# either, and keeping it in infra/deploy.env means a fork or a second
# deployment needs no edit here.
#
#   CATLOG_SSH_HOST=203.0.113.10   (or a DNS name)
#   CATLOG_SSH_USER=catlogadmin
#   CATLOG_SSH_PORT=22             (optional)
all:
  children:
    catlog:
      hosts:
        catlog-prod:
          ansible_host: "{{ lookup('env', 'CATLOG_SSH_HOST') }}"
          ansible_user: "{{ lookup('env', 'CATLOG_SSH_USER') | default('root', true) }}"
          ansible_port: "{{ lookup('env', 'CATLOG_SSH_PORT') | default('22', true) }}"
