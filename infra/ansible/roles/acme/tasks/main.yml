# roles/acme — Let's Encrypt certificates via acme.sh, DNS-01 against Cloudflare.
#
# WHY DNS-01 AND NOT HTTP-01
# The public record is orange-clouded, and Cloudflare's "Always Use HTTPS"
# redirects /.well-known/acme-challenge/ before it reaches this box. DNS-01
# needs no inbound path at all, which also means the certificate can be issued
# and renewed before the DNS record points anywhere near here.
#
# WHY NOT A SIDECAR
# The container is a one-shot, run by a host timer. A permanently-running
# container holding the Docker socket so it could reload nginx itself would be a
# larger hole than the hardened base closes on the other side of the diagram.
# The timer reloads nginx from the host, afterwards.

- name: Refuse to continue without a Cloudflare token
  ansible.builtin.assert:
    that:
      - acme_cf_token | length > 0
      - acme_email | length > 0
    fail_msg: >-
      CF_API_TOKEN and ACME_EMAIL must be set in infra/deploy.env. The token
      needs exactly two permissions on the one zone: Zone:DNS:Edit and
      Zone:Zone:Read. A Global API Key would work and must not be used — it can
      do everything to every zone on the account.
    quiet: true

- name: Build the certificate's name list
  ansible.builtin.set_fact:
    acme_domains: >-
      {{ [catlog_domain] + ([catlog_origin_domain] if catlog_origin_domain | length > 0 else []) }}

- name: Register the ACME account
  # Idempotent: acme.sh skips an account it already has. `|| true` is avoided on
  # purpose — a registration that genuinely fails should stop the play here,
  # not at the more confusing issuance step.
  ansible.builtin.command:
    cmd: >-
      docker compose --profile acme run --rm acme
      --register-account -m {{ acme_email }}
      --server {{ 'letsencrypt_test' if acme_staging | bool else 'letsencrypt' }}
    chdir: /opt/catlog
  register: acme_register
  changed_when: "'Already registered' not in acme_register.stdout"

- name: Look for an existing certificate
  ansible.builtin.stat:
    path: "{{ catlog_data_root }}/acme/live/fullchain.pem"
  register: acme_existing

- name: Read the issuer on the existing certificate
  # WHICH CA SIGNED IT IS PART OF THE QUESTION, not a detail. acme.sh stores the
  # ACME directory per domain, so `--cron` renews from whatever CA first issued
  # — for ever. Switching from staging to production is therefore not a renewal
  # at all; it is a reissue against a different `--server`, and nothing in a
  # renewal path can do it. Left undetected, `make certs` reports success and
  # the origin keeps serving an untrusted certificate.
  ansible.builtin.command:
    cmd: "openssl x509 -noout -issuer -in {{ catlog_data_root }}/acme/live/fullchain.pem"
  register: acme_existing_issuer
  changed_when: false
  failed_when: false
  when: acme_existing.stat.exists

- name: Read the names on the existing certificate
  # A certificate that does not cover catlog_origin_domain has to be reissued,
  # and "it exists" is not the same question as "it covers what we serve".
  ansible.builtin.command:
    cmd: >-
      openssl x509 -noout -ext subjectAltName
      -in {{ catlog_data_root }}/acme/live/fullchain.pem
  register: acme_existing_sans
  changed_when: false
  failed_when: false
  when: acme_existing.stat.exists

- name: Work out whether the certificate came from the CA we want
  # Let's Encrypt's staging chain says so in the issuer, e.g.
  #   issuer=C=US, O=(STAGING) Let's Encrypt, CN=(STAGING) Wannabe Watercress R11
  ansible.builtin.set_fact:
    acme_cert_is_staging: "{{ 'STAGING' in (acme_existing_issuer.stdout | default('') | upper) }}"

- name: Work out which names are missing from it
  # Each name is matched WITH its `DNS:` prefix, which is what stops
  # `catlog.science.fail` being judged present merely because
  # `origin.catlog.science.fail` contains it. The prefix is prepended with an
  # empty-anchor substitution and NO backreference: a replacement like `DNS:\1`
  # does not survive a YAML folded scalar — the backslash arrives literally, the
  # group is never expanded, and every name maps to the same dead string. That
  # made this check always fail, which meant a certificate was requested on
  # EVERY provision run. Against Let's Encrypt's production CA that is five runs
  # to a week-long duplicate-certificate lockout.
  ansible.builtin.set_fact:
    acme_missing_names: >-
      {{ acme_domains
         | map('regex_replace', '^', 'DNS:')
         | reject('in', acme_existing_sans.stdout | default(''))
         | list }}

- name: Say what the existing certificate covers
  ansible.builtin.debug:
    msg: >-
      {{ 'No certificate yet — issuing for ' ~ (acme_domains | join(', ')) ~ ' from the '
            ~ ('STAGING' if acme_staging | bool else 'PRODUCTION') ~ ' CA.'
         if not acme_existing.stat.exists
         else ('Existing certificate is from the ' ~ ('STAGING' if acme_cert_is_staging | bool else 'PRODUCTION')
               ~ ' CA; we want ' ~ ('STAGING' if acme_staging | bool else 'PRODUCTION') ~ ' — reissuing.'
               if acme_cert_is_staging | bool != acme_staging | bool
               else ('Certificate is missing ' ~ (acme_missing_names | join(', ')) ~ ' — reissuing.'
                     if acme_missing_names | length > 0
                     else ('ACME_FORCE is set — reissuing anyway.' if acme_force | bool
                           else 'Certificate covers every name and is from the right CA — not reissuing.'))) }}

- name: Issue the certificate
  ansible.builtin.command:
    cmd: >-
      docker compose --profile acme run --rm acme
      --issue --dns dns_cf
      {% for d in acme_domains %}-d {{ d }} {% endfor %}
      {{ '--force' if acme_force | bool or acme_existing.stat.exists else '' }}
      --server {{ 'letsencrypt_test' if acme_staging | bool else 'letsencrypt' }}
      --keylength ec-256
      --key-file /certs/privkey.pem
      --fullchain-file /certs/fullchain.pem
      --cert-file /certs/cert.pem
      --ca-file /certs/chain.pem
    chdir: /opt/catlog
  register: acme_issue
  changed_when: "'Cert success' in acme_issue.stdout or 'Certificate has been issued' in acme_issue.stdout"
  # acme.sh exits 2 for "skipped — nothing to do": the domains have not changed
  # and the certificate is not yet within its renewal window. That is the
  # healthy case, not a failure, and it is acme.sh's own guard against exactly
  # the runaway this role's gate is meant to prevent. Treating it as an error
  # made a correct no-op fail the play.
  failed_when: acme_issue.rc not in [0, 2]
  # No certificate, a name missing from it, the wrong CA, or an explicit force.
  # A healthy re-run of `make provision` matches none of those and issues
  # nothing.
  when: >-
    not acme_existing.stat.exists
    or acme_missing_names | length > 0
    or acme_cert_is_staging | bool != acme_staging | bool
    or acme_force | bool
  notify: Reload nginx after renewal

- name: Install the renewal script
  ansible.builtin.template:
    src: catlog-acme-renew.sh.j2
    dest: /usr/local/sbin/catlog-acme-renew
    mode: "0750"

- name: Install the renewal unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/catlog-acme.service
    mode: "0644"
    content: |
      # Managed by Ansible (roles/acme).
      [Unit]
      Description=catlog certificate renewal (acme.sh, DNS-01)
      After=docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/catlog-acme-renew

- name: Install the renewal timer
  ansible.builtin.copy:
    dest: /etc/systemd/system/catlog-acme.timer
    mode: "0644"
    content: |
      # Managed by Ansible (roles/acme).
      #
      # Daily. acme.sh only acts when a certificate is within 30 days of expiry,
      # so this is a no-op on 335 days out of 365 — which is what you want from
      # something that must never be the reason a renewal was missed.
      [Unit]
      Description=catlog certificate renewal

      [Timer]
      OnCalendar={{ acme_renew_oncalendar }}
      RandomizedDelaySec=1800
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: Enable the renewal timer
  ansible.builtin.systemd_service:
    name: catlog-acme.timer
    enabled: true
    state: started
    daemon_reload: true
