# roles/catlog_nginx — the server blocks, and who nginx believes the client is.
#
# The http-level half — compression, the rate-limit zones, the catlogd upstream,
# the JSON log format — is baked into the image at /etc/nginx/nginx.conf, because
# it is domain-independent and can therefore be validated by `nginx -t` at build
# time. Only what depends on this host is rendered here.
#
# NOTHING IN THESE PLAYBOOKS MANAGES A FIREWALL. Who may reach ports 22, 80 and
# 443 is decided at the DigitalOcean cloud firewall, by hand. Docker maintains
# its own iptables rules for the ports it publishes and needs no help. The
# Cloudflare ranges fetched below are used for ONE thing — `set_real_ip_from` —
# which is nginx configuration, not packet filtering.

# ---------------------------------------------------------------------------
# Cloudflare's ranges, for real_ip
# ---------------------------------------------------------------------------
# Refetched every run. They change, and a stale list has two failure modes:
# an address Cloudflare has released is still trusted to set CF-Connecting-IP,
# and an address it has added has its traffic attributed to the edge instead of
# to the visitor — which lands in the rate-limit buckets and the access log.

- name: Fetch the Cloudflare IPv4 ranges
  ansible.builtin.uri:
    url: "{{ cloudflare_ips_v4_url }}"
    return_content: true
    timeout: 15
  register: cf_v4
  failed_when: false
  changed_when: false
  check_mode: false
  delegate_to: localhost
  become: false

- name: Fetch the Cloudflare IPv6 ranges
  ansible.builtin.uri:
    url: "{{ cloudflare_ips_v6_url }}"
    return_content: true
    timeout: 15
  register: cf_v6
  failed_when: false
  changed_when: false
  check_mode: false
  delegate_to: localhost
  become: false

- name: Fall back to the vendored ranges
  ansible.builtin.set_fact:
    cloudflare_v4: >-
      {{ (cf_v4.content | default('')).split('\n') | map('trim') | reject('equalto', '') | list
         if cf_v4.status | default(0) == 200
         else lookup('file', 'cloudflare-ips-v4.txt').splitlines() | map('trim') | reject('equalto', '') | list }}
    cloudflare_v6: >-
      {{ (cf_v6.content | default('')).split('\n') | map('trim') | reject('equalto', '') | list
         if cf_v6.status | default(0) == 200
         else lookup('file', 'cloudflare-ips-v6.txt').splitlines() | map('trim') | reject('equalto', '') | list }}

- name: Say where the ranges came from
  ansible.builtin.debug:
    msg: >-
      Cloudflare ranges: {{ cloudflare_v4 | length }} v4 + {{ cloudflare_v6 | length }} v6,
      {{ 'fetched live' if cf_v4.status | default(0) == 200 else 'FROM THE VENDORED FALLBACK — refresh it' }}.
      These are also the source list for the DigitalOcean firewall, which is
      maintained by hand — re-check it when this list moves.

- name: Refuse to continue with an implausible range list
  # A truncated or HTML-ified response would otherwise be written into
  # set_real_ip_from, and nginx would stop trusting Cloudflare's headers —
  # collapsing every visitor into an edge address in the rate limiter and the log.
  ansible.builtin.assert:
    that:
      - cloudflare_v4 | length >= 10
      - cloudflare_v6 | length >= 5
      - cloudflare_v4 | select('search', '/') | list | length == cloudflare_v4 | length
    fail_msg: "The Cloudflare range list does not look like a list of CIDRs. Refusing to apply it."
    quiet: true

- name: Publish the combined range list
  ansible.builtin.set_fact:
    cloudflare_ranges: "{{ cloudflare_v4 + cloudflare_v6 }}"

# ---------------------------------------------------------------------------
# The configuration
# ---------------------------------------------------------------------------

- name: Render the server blocks
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../nginx/site.conf.j2"
    dest: "{{ catlog_data_root }}/nginx/conf/10-catlog.conf"
    mode: "0644"
  notify: Reload nginx

- name: Render the real_ip configuration
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../nginx/realip.conf.j2"
    dest: "{{ catlog_data_root }}/nginx/conf/20-realip.conf"
    mode: "0644"
  notify: Reload nginx

- name: Look for a certificate
  ansible.builtin.stat:
    path: "{{ catlog_data_root }}/acme/live/fullchain.pem"
  register: catlog_cert

- name: Say that nginx cannot start yet
  # nginx refuses to start at all when ssl_certificate names a file that is not
  # there, so this is the difference between "certificates not issued yet" and
  # "the proxy is broken".
  ansible.builtin.debug:
    msg: >-
      No certificate at {{ catlog_data_root }}/acme/live/fullchain.pem yet.
      nginx will not start until roles/acme has issued one — run `make certs`.
  when: not catlog_cert.stat.exists

- name: Check the rendered configuration
  # Validated inside a throwaway container against the real image, so a broken
  # server block is caught before it is loaded rather than after nginx has
  # refused to come back.
  ansible.builtin.command:
    cmd: docker compose run --rm --no-deps --entrypoint nginx nginx -t
    chdir: /opt/catlog
  changed_when: false
  when: catlog_cert.stat.exists

- name: Start nginx
  ansible.builtin.command:
    cmd: docker compose up -d nginx
    chdir: /opt/catlog
  changed_when: true
  when: catlog_cert.stat.exists
