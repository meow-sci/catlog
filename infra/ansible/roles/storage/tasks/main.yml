# roles/storage — the directory tree on the NVMe volume.
#
# THE VOLUME IS THE PROVIDER'S. DigitalOcean formats it ext4, mounts it and puts
# it in fstab; nothing here discovers a block device, creates a filesystem or
# writes a mount unit. This role verifies the two properties catlog depends on
# and then lays out the directories.
#
# Everything catlog must not lose lives under catlog_data_root: the databases,
# the key set, the archive, the config, the certificates and the backups. One
# root, so there is one thing to back up and one thing to move.

- name: Refuse to continue without a data root
  ansible.builtin.assert:
    that: catlog_data_root | length > 1
    fail_msg: "catlog_data_root is unset. Set CATLOG_DATA_ROOT in infra/deploy.env."
    quiet: true

- name: Look at the data root
  ansible.builtin.command:
    cmd: "findmnt -no SOURCE,FSTYPE,OPTIONS {{ catlog_data_root }}"
  register: catlog_mount
  changed_when: false
  failed_when: false

# --- the two checks that matter --------------------------------------------

- name: Refuse to continue if the volume is not actually mounted
  # `findmnt <path>` (no --target) succeeds only when the path is itself a mount
  # point. Without this check, a volume that failed to attach leaves an ordinary
  # empty directory on the root disk — and catlog would cheerfully open its
  # databases there, on a filesystem an order of magnitude smaller, and lose them
  # the next time the droplet was rebuilt. It is a silent failure with a very
  # loud consequence, so it is checked before anything is created.
  ansible.builtin.assert:
    that: catlog_mount.rc == 0
    fail_msg: >-
      {{ catlog_data_root }} is not a mount point — the NVMe volume is not
      attached, or is mounted somewhere else. Check the droplet's Volumes tab and
      /etc/fstab. Continuing would put the databases on the root disk.
      (Set catlog_require_mounted_volume=false to allow it anyway; that is for
      a throwaway test box, not for anything holding data.)
    quiet: true
  when: catlog_require_mounted_volume | bool

- name: Refuse to continue on a noexec mount
  # The Turso driver extracts a 19 MB native shared object under this root and
  # dlopen()s it at first database open. A noexec mount turns that into a
  # startup crash whose message names a permission error on a file catlogd has
  # just written successfully — the least obvious failure in this system.
  #
  # We do not own the mount any more, so this cannot be fixed here. Refusing
  # early with the reason is worth more than a crash three steps later.
  ansible.builtin.assert:
    that: "'noexec' not in catlog_mount.stdout"
    fail_msg: >-
      {{ catlog_data_root }} is mounted noexec ({{ catlog_mount.stdout }}).
      catlogd would fail at startup when the Turso driver dlopen()s the shared
      object it extracts there. Remount without noexec and fix /etc/fstab.
    quiet: true

- name: Prove the filesystem can execute a file
  # The empirical half of the check above: findmnt reports this mount's flags,
  # this reports whether execve actually works — which also catches noexec
  # inherited from a parent mount, or a hardened kernel module.
  ansible.builtin.shell:
    cmd: |
      set -e
      probe="{{ catlog_data_root }}/.catlog-exec-probe"
      printf '#!/bin/sh\nexit 0\n' > "$probe"
      chmod 0755 "$probe"
      "$probe"
      rm -f "$probe"
  changed_when: false
  check_mode: false

# --- the directory tree -----------------------------------------------------
#
# config/ and nginx/ are root-owned: catlogd reads them and must never be able
# to rewrite its own configuration. Everything catlogd writes is owned by the
# container's nonroot uid.

- name: Create the directory tree
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ catlog_data_root }}/config", mode: "0750", group: catlog}
    # events.db, projections.db, keys/ and archive/ — the bind mount that
    # becomes /var/lib/catlog/data inside the container.
    - {path: "{{ catlog_data_root }}/data", mode: "0750", owner: "{{ catlog_uid }}", group: "{{ catlog_gid }}"}
    # The extracted .so. Its own directory at 0700 so a stale copy can be
    # deleted without touching anything else.
    - {path: "{{ catlog_data_root }}/turso-cache", mode: "0700", owner: "{{ catlog_uid }}", group: "{{ catlog_gid }}"}
    # Written by catlogd itself: `catlogctl backup` is an admin API call, so the
    # process that quiesces the writer and copies the database is catlogd.
    - {path: "{{ catlog_data_root }}/backups", mode: "0750", owner: "{{ catlog_uid }}", group: "{{ catlog_gid }}"}
    - {path: "{{ catlog_data_root }}/acme", mode: "0700"}
    - {path: "{{ catlog_data_root }}/acme/data", mode: "0700"}
    # Mounted read-only into nginx. 0755 because nginx's workers read it as a
    # different user than the one acme.sh writes it as.
    - {path: "{{ catlog_data_root }}/acme/live", mode: "0755"}
    - {path: "{{ catlog_data_root }}/nginx", mode: "0755"}
    - {path: "{{ catlog_data_root }}/nginx/conf", mode: "0755"}
  loop_control:
    label: "{{ item.path }}"

- name: Report the volume
  ansible.builtin.debug:
    msg: "{{ catlog_data_root }} — {{ catlog_mount.stdout | default('not a separate mount') }}"
