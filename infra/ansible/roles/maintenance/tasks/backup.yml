# One backup, on demand. `make ops-backup`.
- name: Take a backup
  # Runs INSIDE catlogd: a live Turso file cannot be read by another process at
  # all, and `cp` of a WAL database is not a backup anyway. catlogctl asks the
  # admin API, which quiesces the writer and copies events.db and its -wal.
  ansible.builtin.command:
    cmd: docker compose exec -T catlogd catlogctl backup
    chdir: /opt/catlog
  register: catlog_backup
  changed_when: true

- name: Report
  ansible.builtin.debug:
    var: catlog_backup.stdout_lines

- name: List what is on disk
  ansible.builtin.command:
    cmd: "ls -lh {{ catlog_data_root }}/backups"
  register: catlog_backup_list
  changed_when: false

- name: Report the backup directory
  ansible.builtin.debug:
    var: catlog_backup_list.stdout_lines
