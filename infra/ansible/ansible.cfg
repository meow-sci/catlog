# catlog — Ansible configuration. See docs/operations.md.
#
# Every playbook is run through the repository's make targets, which export the
# contents of infra/deploy.env first. Nothing here needs to be passed on a
# command line, and secrets deliberately cannot be: `--extra-vars` would put
# them in your shell history and in the VM's process table.

[defaults]
inventory                = inventories/prod/hosts.yml
roles_path               = roles
host_key_checking        = True
retry_files_enabled      = False
# NOT `stdout_callback = yaml` — that was community.general's plugin, removed in
# community.general 12.0.0. The alpine/ansible image ships 13, where naming it is
# a hard error at startup rather than a warning.
stdout_callback          = default
display_skipped_hosts    = False
interpreter_python       = auto_silent

# Facts are addressed as ansible_facts['name'], never as the injected top-level
# `ansible_name`. ansible-core deprecated that injection and removes it in 2.24,
# so this turns "a warning during `make deploy`" into "an undefined variable the
# first time somebody writes the old form" — which is the failure you want,
# while there is still a version that supports both.
inject_facts_as_vars     = False
# Facts are cheap here (one host) and several roles need them before they can
# decide anything, so gathering is left on.
forks                    = 5

# `[defaults]`, not `[ssh_connection]`: that section is not recognised by
# ansible-core 2.21 (`ansible-config validate` reports it as unknown), and every
# setting in it was being silently ignored. Verified with `ansible-config dump`
# rather than assumed — a config file whose lines do nothing is worse than one
# that is missing them, because it reads as if the behaviour is configured.
pipelining               = True
# ssh_args is NOT set here: scripts/ansible.sh passes ANSIBLE_SSH_ARGS, which
# replaces this wholesale, and carrying both would make one of them a decoy.

[privilege_escalation]
become        = True
become_method = sudo
