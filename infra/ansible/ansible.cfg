# catlog — Ansible configuration. See docs/operations.md.
#
# Every playbook is run through the repository's make targets, which export the
# contents of infra/deploy.env first. Nothing here needs to be passed on a
# command line, and secrets deliberately cannot be: `--extra-vars` would put
# them in your shell history and in the VM's process table.

[defaults]
inventory                = inventories/prod/hosts.yml
roles_path               = roles
host_key_checking        = True
retry_files_enabled      = False
stdout_callback          = yaml
display_skipped_hosts    = False
interpreter_python       = auto_silent
# Facts are cheap here (one host) and several roles need them before they can
# decide anything, so gathering is left on.
forks                    = 5

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30

[privilege_escalation]
become        = True
become_method = sudo
