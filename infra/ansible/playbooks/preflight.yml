# make preflight — read-only. Changes nothing, anywhere.
#
# Everything it checks is something that, if wrong, produces a confusing failure
# much later: a missing secret surfaces as an empty OAuth client id at first
# login, a noexec mount surfaces as a permission error on a file catlogd just
# wrote, a uid mismatch surfaces as a broken key directory.
- name: Preflight
  hosts: catlog
  gather_facts: true
  become: true
  tasks:
    - name: Check the controller has the collections the roles import
      # Nothing installs these: they come with the alpine/ansible image that
      # scripts/ansible.sh runs. Checked rather than assumed, so a base-image
      # change that dropped one fails here instead of halfway through a play.
      delegate_to: localhost
      become: false
      ansible.builtin.assert:
        that:
          - "'community.docker' in lookup('ansible.builtin.pipe', 'ansible-galaxy collection list 2>/dev/null')"
          - "'community.general' in lookup('ansible.builtin.pipe', 'ansible-galaxy collection list 2>/dev/null')"
          - "'ansible.posix' in lookup('ansible.builtin.pipe', 'ansible-galaxy collection list 2>/dev/null')"
        fail_msg: >-
          The Ansible controller is missing a collection the roles import. With
          scripts/ansible.sh this should be impossible — check ANSIBLE_IMAGE is
          still alpine/ansible. Running ansible locally instead? Then:
          ansible-galaxy collection install -r infra/ansible/requirements.yml
        quiet: true

    - name: Note how the host key is being trusted
      # Not an assertion: an unpinned run still works off your own known_hosts.
      # It is worth saying which is in force, because the two fail differently —
      # a pin fails loudly and specifically on a changed key.
      delegate_to: localhost
      become: false
      ansible.builtin.debug:
        msg: >-
          {{ 'Host key PINNED from CATLOG_SSH_HOST_KEY — no trust-on-first-use.'
             if lookup('env', 'CATLOG_SSH_HOST_KEY') | length > 0 else
             'CATLOG_SSH_HOST_KEY is unset — the host key is not pinned. Set it in
              infra/deploy.env so there is no trust-on-first-use step.' }}

    - name: Check every required setting is present
      # All of them at once. A preflight you have to run six times to learn six
      # things is not a preflight.
      ansible.builtin.assert:
        that:
          - catlog_domain | length > 0
          - acme_email | length > 0
          - acme_cf_token | length > 0
          - catlog_data_root | length > 1
        fail_msg: |
          infra/deploy.env is incomplete. Missing:
          {% if catlog_domain | length == 0 %}  CATLOG_DOMAIN
          {% endif %}{% if acme_email | length == 0 %}  ACME_EMAIL
          {% endif %}{% if acme_cf_token | length == 0 %}  CF_API_TOKEN
          {% endif %}{% if catlog_data_root | length <= 1 %}  CATLOG_DATA_ROOT
          {% endif %}
          Start from infra/deploy.env.example, which documents every key.
        quiet: true

    - name: Note which optional settings are unset
      ansible.builtin.debug:
        msg: >-
          {{ 'CATLOG_ORIGIN_DOMAIN is unset — there will be no Cloudflare-bypassing name to test with.'
             if catlog_origin_domain | length == 0 else
             'Direct name: ' ~ catlog_origin_domain ~ ' — reachable to whoever the DigitalOcean
              firewall lets reach 443. Nothing on the box restricts it further.' }}

    - name: Check the host is Debian or Ubuntu
      ansible.builtin.assert:
        that: ansible_facts.os_family == "Debian"
        fail_msg: "{{ ansible_facts.os_family }} is not supported — see roles/common."
        quiet: true

    - name: Look for Docker
      ansible.builtin.command: docker --version
      register: pf_docker
      changed_when: false
      failed_when: false

    - name: Look for the compose plugin
      ansible.builtin.command: docker compose version
      register: pf_compose
      changed_when: false
      failed_when: false

    - name: Look at the data root
      # No --target: this must report the path ITSELF being a mount point. A
      # volume that failed to attach leaves a plain directory, and --target
      # would happily report the root filesystem and look fine.
      ansible.builtin.command: "findmnt -no SOURCE,FSTYPE,OPTIONS {{ catlog_data_root }}"
      register: pf_mount
      changed_when: false
      failed_when: false

    - name: Look at free space
      ansible.builtin.command: "df -h {{ catlog_data_root }}"
      register: pf_df
      changed_when: false
      failed_when: false

    - name: Report
      ansible.builtin.debug:
        msg: |
          host        {{ inventory_hostname }} ({{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }})
          ssh as      {{ ansible_user_id }} with the key named by CATLOG_SSH_IDENTITY_FILE
          docker      {{ pf_docker.stdout | default('NOT INSTALLED — `make provision` will install it') }}
          compose     {{ pf_compose.stdout | default('NOT INSTALLED — `make provision` will install it') }}
          data root   {{ catlog_data_root }}
          volume      {{ pf_mount.stdout if pf_mount.rc == 0 else
                          'NOT A MOUNT POINT — the NVMe volume is not attached at ' ~ catlog_data_root }}
          {{ pf_df.stdout | default('') }}

    - name: Warn about a noexec data root
      # The single most confusing failure in this system, so it is checked here
      # as well as enforced in roles/storage: the Turso driver extracts a native
      # .so under this root and dlopen()s it. We do not own the mount — the
      # provider does — so this can only be refused, never fixed.
      ansible.builtin.assert:
        that: "'noexec' not in (pf_mount.stdout | default(''))"
        fail_msg: >-
          {{ catlog_data_root }} is mounted noexec. catlogd will fail at startup
          when the Turso driver tries to dlopen the shared object it extracts
          there. Remount without noexec before provisioning.
        quiet: true
