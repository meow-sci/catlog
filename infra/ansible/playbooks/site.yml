# make provision — the whole box, from a fresh VM to one ready for `make deploy`.
#
# Idempotent and re-runnable: running it against a healthy host changes nothing.
# Nothing here manages a firewall. Ports 22, 80 and 443 are governed by the
# DigitalOcean cloud firewall, by hand; Docker maintains its own iptables rules
# for the ports it publishes and needs no help from us.
- name: Provision the catlog host
  hosts: catlog
  become: true
  roles:
    - role: common
      tags: [common, baseline]
    - role: storage
      tags: [storage, baseline]
    - role: docker
      tags: [docker, baseline]
    - role: catlog_app
      tags: [app]
    - role: acme
      tags: [certs]
    - role: catlog_nginx
      tags: [nginx]
    - role: maintenance
      tags: [maintenance]
