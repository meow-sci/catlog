# catlogd — local development configuration (§5.3).
#
# Committed on purpose: D2 says the entire system runs locally, and this is the
# file that makes that true. Every IdP points at `mockidp` on 127.0.0.1:9090
# (§5.8.1), so no real Discord/Google/GitHub call is ever made in dev or in
# tests. The client id/secret are the literal strings "dev"/"dev" — mockidp
# checks them, so the OAuth form-post path is genuinely exercised, but there is
# nothing here worth protecting.
#
# Run with:  catlogd -config server/catlogd.dev.toml
#
# Any value can be overridden by the environment as CATLOG_<SECTION>_<KEY>,
# e.g. CATLOG_SERVER_LISTEN=127.0.0.1:9999 or CATLOG_DATA_DIR=/tmp/catlog.
# Production keeps its secrets there rather than in a file (§11).

[server]
listen       = "127.0.0.1:8080"
admin_listen = "127.0.0.1:6060"          # loopback only, never proxied (§5.9)
base_url     = "http://127.0.0.1:8080"   # license `iss` AND the htu base (§4.5.1)
# Relative to the working directory, like `[data] dir` below, and every dev
# entry point (`make dev`, `make e2e`, scripts/e2e-full.sh) runs catlogd from
# the repo root. §5.3's literal "../site/dist" is written from server/'s point
# of view and would resolve outside the repo here (docs/DECISIONS.md, WP5).
static_dir   = "site/dist"               # served at /static/ in dev; nginx serves it in prod
# Mounts POST /admin/clock, which moves this server's notion of now. Every
# authoritative timestamp catlog produces is server-generated — an event's
# recv_time, a license's iat/exp, a session's expiry — so the server clock is
# the only thing that decides which day, week, month or year a leaderboard row
# lands in, and a rolling yearly board is otherwise untestable without waiting a
# year. Development only: it defaults to false, catlogd refuses to start with it
# on an https base_url, and the route lives on the loopback-only admin mux.
clock_control = true
# Concurrent SSE subscribers per stream route (/v1/feed/stream,
# /v1/events/stream); over the cap is 429 + Retry-After. 0 means the read API's
# default of 64.
max_stream_clients = 0

[data]
dir = "./data"                            # events.db, projections.db, keys/, archive/ (§3)
# The Turso WAL never auto-checkpoints — nothing folds pages back into the main
# database file unless we ask (see docs/DECISIONS.md, WP1). Every open database
# runs PRAGMA wal_checkpoint(TRUNCATE) on this interval and again at shutdown.
checkpoint_interval_s = 60
# Event payloads are zstd-compressed with a trained dictionary on write
# (store migration 0003) — measured ~3.3x on the payload column. false is the
# escape hatch: new rows are stored as plain JSON text. Rows written either
# way stay readable, so flipping this is always safe.
compress_payloads = true

[ingest]
# Compared to the proof's `htu` by exact string equality — no normalization
# (§4.5.2). Prod lists the public URL instead.
accepted_htu   = ["http://127.0.0.1:8080/v1/ingest"]
max_body_bytes = 1048576                  # 1 MiB compressed → 413 too_large (§4.3)
max_events     = 2000                     # per batch → 413 too_large (§4.3)
# How many ingest requests may hold a body in memory at once (read, brotli-
# expanded, decoded — up to ~9 MiB each at the caps above). This is the knob
# that sizes peak ingest memory; 0 means 4× GOMAXPROCS. Over the cap the client
# gets 503 + Retry-After: 5, the same answer as a full write queue.
max_inflight   = 0

[auth]
license_ttl_days     = 180                # D16
handle_quota         = 5                  # live handles per account (§4.7)
issuance_per_day     = 3                  # license issuances per 24 h (§4.7)
min_account_age_days = 30                 # Discord snowflake / GitHub created_at gate (§4.7)
# The "+ configurable extras" of §4.7's reserved-handle list. These are ADDED to
# the built-in set (admin, catlog, api, root, …), never substituted for it, and
# are matched case-insensitively.
reserved_handles     = []

# --- IdPs: all three served by mockidp on 127.0.0.1:9090 (§5.8.1) -----------

[idp.discord]
auth_url      = "http://127.0.0.1:9090/discord/oauth/authorize"
token_url     = "http://127.0.0.1:9090/discord/oauth/token"
api_base      = "http://127.0.0.1:9090/discord/api"
client_id     = "dev"
client_secret = "dev"

[idp.google]
issuer        = "http://127.0.0.1:9090/google"
auth_url      = "http://127.0.0.1:9090/google/authorize"
token_url     = "http://127.0.0.1:9090/google/token"
jwks_url      = "http://127.0.0.1:9090/google/jwks"
client_id     = "dev"
client_secret = "dev"

[idp.github]
auth_url      = "http://127.0.0.1:9090/github/login/oauth/authorize"
token_url     = "http://127.0.0.1:9090/github/login/oauth/access_token"
api_base      = "http://127.0.0.1:9090/github"
client_id     = "dev"
client_secret = "dev"

[limits]
ratelimit_per_jkt_per_s = 0.5             # 1 batch / 2 s (§4.3)
ratelimit_burst         = 5
# Removes §4.5.3 step 9 from the chain: no token bucket, no 429, one credential
# may ship as fast as it can sign. **Load testing only**, and left off here so
# that `make dev`, `make e2e` and the integration suites all exercise the real
# limit. catlogd refuses to start with it on an https base_url and logs a WARN
# naming the base URL for as long as it runs with it on.
#
# The per-credential bucket is the ceiling on catlog.loadgen — at 0.5/s a
# harness run measures the bucket and nothing else — so a throughput run turns
# it off for one process rather than editing this file:
#
#   CATLOG_LIMITS_RATELIMIT_DISABLED=1 catlogd -config server/catlogd.dev.toml
#
# To go *faster* rather than *unlimited*, raise ratelimit_per_jkt_per_s above
# instead. That keeps a real limit in the chain and needs no gate:
#
#   CATLOG_LIMITS_RATELIMIT_PER_JKT_PER_S=50 catlogd -config …
ratelimit_disabled      = false

[boards]
# `fastest_to_<body>` and `rud_<cause>` take their keys from the event stream —
# KSA's celestial systems are content that mods extend, and catlog keeps no list
# of bodies (docs/events.md: `body` is "opaque to server"). Such a board is
# listed by GET /v1/leaderboards once this many distinct players are on it.
#
# 2 is the default and the point: it stops one modified client minting ten
# thousand boards, and a leaderboard with one entrant is not a leaderboard. The
# per-player value is recorded for every body and cause regardless, so lowering
# this publishes history that is already there rather than starting to collect
# it (docs/DECISIONS.md).
min_players = 2

[projector]
# How much of the event log the fold loop takes on at a time — the projector's
# speed-versus-memory dial.
#
# Folding is dominated by the cost of a Turso statement (~15 µs each, whatever
# it says), so the projector buffers a batch's projection writes in memory,
# merges repeated writes to the same board, and flushes the survivors as
# multi-row statements. A bigger batch has more to merge: on a telemetry-heavy
# synthetic log, 10,000 events per batch folds about 20% faster than 1,000 —
# and holds ten times as many decoded payloads while it does.
#
# 1000 is §5.6's number and is sized for a small VM: a batch's peak footprint is
# a few megabytes. Raise it on a machine with memory to spare.
batch_size = 1000

# Rows per flushed statement. Beyond a few hundred the per-row cost is flat, so
# this bounds the bound-parameter count rather than being a tuning knob.
flush_rows = 500

# Fallback poll interval, seconds. The ingest writer's notify channel wakes the
# projector for every real arrival; the ticker exists only to recover from a
# dropped wake-up, so this trades idle wake-ups against worst-case lag after
# one. 0 means the default (5 s).
tick_s = 0

# Rebuild the projections automatically when the file on disk was built by a
# different fold set than this binary — a deploy that added a board, changed
# one, or changed what one computes.
#
# On, catlogd handles a boards deploy by itself: it suspends the fold loop so no
# half-built board is ever served, keeps answering reads from the old file, and
# swaps the rebuilt one in when it is ready. Off leaves the loop suspended and
# the boards frozen until `catlogctl rebuild` is run by hand.
auto_rebuild = true

# Goroutines that decode a batch's payloads before the serial fold. 0 means one
# per core, less one for the ingest that produced the backlog.
#
# Decoding is the only part of folding that the single writer does not
# serialise. It is also, on payloads as small as §4.2's, not where the time
# goes: measured, the whole decode pass is about 1% of a drain. This is a knob
# for a future with fatter payloads, not a lever on today's numbers.
decoders = 0

# --- cross-origin reads ------------------------------------------------------
#
# Which browser origins may read the §4.8 public endpoints — /v1/leaderboards,
# /v1/players/{handle}, /v1/feed — and nothing else. /api/*, /auth/* and the
# admin mux are cookie-authenticated and stay same-origin no matter what is
# listed here (server/internal/readapi/cors.go).
#
# EMPTY, and it should stay empty here. catlog's own site is rendered by catlogd
# and is same-origin, so development needs none of this. The list exists for a
# third-party reader — a community dashboard, an overlay — that fetches the
# public read API from its own origin; add that origin only when there is one,
# and add it in the environment (CATLOG_CORS_ALLOWED_ORIGINS=https://…) rather
# than in a file (§11).
#
# Exact `scheme://host[:port]` strings, compared byte for byte. No wildcards, no
# "*", no trailing slash — the server refuses to start on any of those, because
# a malformed entry silently never matches.
[cors]
allowed_origins = []
